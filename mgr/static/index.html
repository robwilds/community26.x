<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alfresco Manager</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --border: #2a2d3a;
    --text: #e1e4eb;
    --muted: #8b8fa3;
    --accent: #4f8cff;
    --accent2: #6c5ce7;
    --green: #2ed573;
    --red: #ff4757;
    --orange: #ffa502;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    padding: 24px;
    min-height: 100vh;
    font-size: 13px;
  }
  .header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 24px; padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .header h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.3px; }
  .header h1 span { color: var(--accent); }
  .header-actions { display: flex; gap: 8px; align-items: center; }
  .status-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 6px;
  }
  .status-dot.healthy { background: var(--green); }
  .status-dot.unhealthy { background: var(--red); }
  .status-dot.not-found { background: var(--muted); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 16px; position: relative;
  }
  .card h2 { font-size: 14px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .card h2 small { font-weight: 400; font-size: 11px; color: var(--muted); }
  .card.full { grid-column: 1 / -1; }

  .badge {
    display: inline-block; padding: 1px 8px; border-radius: 4px;
    font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .badge.healthy { background: rgba(46,213,115,0.15); color: var(--green); }
  .badge.unhealthy { background: rgba(255,71,87,0.15); color: var(--red); }
  .badge.not-found { background: rgba(139,143,163,0.15); color: var(--muted); }

  .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .btn {
    padding: 6px 12px; border: none; border-radius: 5px; font-size: 12px;
    font-weight: 500; cursor: pointer; transition: all .15s; font-family: var(--font);
  }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: #3a78ef; }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-danger:hover:not(:disabled) { background: #e8404f; }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .btn-outline:hover:not(:disabled) { border-color: var(--text); color: var(--text); }
  .btn-sm { padding: 4px 8px; font-size: 11px; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border);
       color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase;
       letter-spacing: 0.3px; }
  td { padding: 6px 8px; border-bottom: 1px solid rgba(42,45,58,0.5); }
  tr:hover td { background: rgba(79,140,255,0.04); }
  .name-cell { font-weight: 500; color: var(--text); }
  .muted { color: var(--muted); }
  .mono { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 11px; }

  .toast {
    position: fixed; bottom: 24px; right: 24px; padding: 12px 20px;
    border-radius: 8px; font-size: 13px; z-index: 1000;
    transform: translateY(120px); opacity: 0; transition: all .3s;
    background: var(--card); border: 1px solid var(--border); max-width: 400px;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { border-color: var(--green); }
  .toast.error { border-color: var(--red); }
  .toast.info { border-color: var(--accent); }

  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
  .tab { padding: 8px 16px; cursor: pointer; font-size: 12px; color: var(--muted);
         border-bottom: 2px solid transparent; transition: all .15s; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .loading { color: var(--muted); font-size: 12px; padding: 12px 0; }
  .empty { color: var(--muted); font-size: 12px; font-style: italic; padding: 12px 0; }

  .section-label { font-size: 11px; color: var(--muted); text-transform: uppercase;
                   letter-spacing: 0.5px; margin-bottom: 8px; margin-top: 12px; }
  .section-label:first-child { margin-top: 0; }

  .inline-form { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .inline-form select {
    background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
    color: var(--text); padding: 4px 8px; font-size: 11px; font-family: var(--font);
  }

  .flex { display: flex; gap: 16px; flex-wrap: wrap; }

  .file-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .file-item {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 8px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 4px; font-size: 11px; font-family: 'SF Mono', monospace;
  }
  .file-item .btn { padding: 2px 6px; font-size: 10px; }
</style>
</head>
<body>
<div class="header">
  <h1><span>alfresco</span> manager</h1>
  <div class="header-actions">
    <span id="status-alfresco" class="badge"><span class="status-dot"></span>loading</span>
    <span id="status-share" class="badge"><span class="status-dot"></span>loading</span>
    <button class="btn btn-primary btn-sm" onclick="restartAll()">Restart All</button>
    <button class="btn btn-outline btn-sm" onclick="refreshAll()">Refresh</button>
  </div>
</div>

<div class="grid">
  <div class="card">
    <h2>AMPs <small>installed modules</small></h2>
    <div class="tabs">
      <div class="tab active" onclick="switchTab('amps','alfresco',this)">Alfresco</div>
      <div class="tab" onclick="switchTab('amps','share',this)">Share</div>
    </div>
    <div id="amps-alfresco" class="tab-content active"></div>
    <div id="amps-share" class="tab-content"></div>
  </div>

  <div class="card">
    <h2>JARs <small>WEB-INF/lib</small></h2>
    <div class="tabs">
      <div class="tab active" onclick="switchTab('jars','alfresco',this)">Alfresco</div>
      <div class="tab" onclick="switchTab('jars','share',this)">Share</div>
    </div>
    <div id="jars-alfresco" class="tab-content active"></div>
    <div id="jars-share" class="tab-content"></div>
  </div>
</div>

<div class="card full">
  <h2>Available Files <small>installs/ directory</small></h2>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('files','alfresco',this)">Content</div>
    <div class="tab" onclick="switchTab('files','share',this)">Share</div>
  </div>
  <div id="files-alfresco" class="tab-content active"></div>
  <div id="files-share" class="tab-content"></div>
</div>

<div id="toast" class="toast"></div>

<script>
const API = '';
let state = { amps: null, jars: null, files: null };

function showToast(msg, type = 'info') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type + ' show';
  setTimeout(() => t.classList.remove('show'), 3000);
}

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  return res.json();
}

function switchTab(group, target, el) {
  document.querySelectorAll(`.tabs .tab`).forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll(`[id^="${group}-"]`).forEach(c => c.classList.remove('active'));
  document.getElementById(`${group}-${target}`).classList.add('active');
}

async function refreshStatus() {
  const data = await api('/api/status');
  for (const svc of ['alfresco', 'share']) {
    const el = document.getElementById(`status-${svc}`);
    const s = data[svc];
    const h = s.health;
    el.className = `badge ${h === 'healthy' ? 'healthy' : 'unhealthy'}`;
    el.innerHTML = `<span class="status-dot ${h === 'healthy' ? 'healthy' : 'unhealthy'}"></span>${svc}: ${h}`;
  }
}

async function refreshAmps() {
  const data = await api('/api/amps');
  state.amps = data;
  for (const svc of ['alfresco', 'share']) {
    renderAmps(svc, data[svc]);
  }
}

function renderAmps(svc, data) {
  const el = document.getElementById(`amps-${svc}`);
  const installed = data.installed || [];
  const pending = data.pending || [];
  let html = '<div class="section-label">Installed</div>';
  if (installed.length === 0) {
    html += '<div class="empty">none</div>';
  } else {
    html += '<table><thead><tr><th>Title</th><th>Version</th><th>ID</th></tr></thead><tbody>';
    for (const a of installed) {
      html += `<tr><td class="name-cell">${esc(a.title || a.id)}</td><td class="mono">${esc(a.version||'-')}</td><td class="muted mono">${esc(a.id)}</td></tr>`;
    }
    html += '</tbody></table>';
  }
  html += '<div class="section-label" style="margin-top:16px">Pending (in amps dir)</div>';
  if (pending.length === 0) {
    html += '<div class="empty">none</div>';
  } else {
    html += '<div class="file-list">';
    for (const p of pending) {
      html += `<span class="file-item"><span>${esc(p)}</span></span>`;
    }
    html += '</div>';
  }
  el.innerHTML = html;
}

async function refreshJars() {
  const data = await api('/api/jars');
  state.jars = data;
  for (const svc of ['alfresco', 'share']) {
    renderJars(svc, data[svc]);
  }
}

async function refreshJars() {
  const data = await api('/api/jars');
  state.jars = data;
  for (const svc of ['alfresco', 'share']) {
    renderJars(svc, data[svc] || []);
  }
}

function renderJars(svc, jars) {
  const el = document.getElementById(`jars-${svc}`);
  if (jars.length === 0) {
    el.innerHTML = '<div class="empty">none</div>';
    return;
  }
  let html = '<table><thead><tr><th>Filename</th><th></th></tr></thead><tbody>';
  for (const j of jars) {
    html += `<tr><td class="mono name-cell">${esc(j)}</td>`;
    html += `<td style="text-align:right"><button class="btn btn-danger btn-sm" onclick="removeJar('${svc}','${escAttr(j)}')">Remove</button></td></tr>`;
  }
  html += '</tbody></table>';
  el.innerHTML = html;
}

async function refreshFiles() {
  const data = await api('/api/local-files');
  state.files = data;
  for (const svc of ['alfresco', 'share']) {
    const key = svc === 'alfresco' ? 'content' : 'share';
    renderFiles(svc, data[key] || []);
  }
}

function renderFiles(svc, files) {
  const el = document.getElementById(`files-${svc}`);
  if (files.length === 0) {
    el.innerHTML = '<div class="empty">no installable files in installs/ directory</div>';
    return;
  }
  let html = '<div class="file-list">';
  for (const f of files) {
    const isAmp = f.endsWith('.amp');
    const action = isAmp ? `installAmp('${svc}','${escAttr(f)}')` : `installJar('${svc}','${escAttr(f)}')`;
    const label = isAmp ? 'Install AMP' : 'Install JAR';
    html += `<span class="file-item">
      <span>${esc(f)}</span>
      <button class="btn btn-primary btn-sm" onclick="${action}">${label}</button>
    </span>`;
  }
  html += '</div>';
  el.innerHTML = html;
}

async function installAmp(svc, filename) {
  const btn = event.target;
  btn.disabled = true; btn.textContent = '...';
  const res = await api('/api/install/amp', {
    method: 'POST',
    body: JSON.stringify({ container: svc, filename }),
  });
  btn.disabled = false; btn.textContent = 'Install AMP';
  if (res.success) {
    showToast(`${filename}: ${res.message}`, 'success');
    refreshAmps();
  } else {
    showToast(res.error || 'install failed', 'error');
  }
}

async function installJar(svc, filename) {
  const btn = event.target;
  btn.disabled = true; btn.textContent = '...';
  const res = await api('/api/install/jar', {
    method: 'POST',
    body: JSON.stringify({ container: svc, filename }),
  });
  btn.disabled = false; btn.textContent = 'Install JAR';
  if (res.success) {
    showToast(`${filename}: ${res.message}`, 'success');
    refreshJars();
  } else {
    showToast(res.error || 'install failed', 'error');
  }
}

async function removeJar(svc, filename) {
  const res = await api('/api/remove/jar', {
    method: 'POST',
    body: JSON.stringify({ container: svc, filename }),
  });
  if (res.success) {
    showToast(`${filename}: ${res.message}`, 'success');
    refreshJars();
  } else {
    showToast(res.error || 'remove failed', 'error');
  }
}

async function restartAll() {
  const btn = event.target; btn.disabled = true;
  showToast('Restarting containers...', 'info');
  const res = await api('/api/restart', {
    method: 'POST',
    body: JSON.stringify({ containers: ['alfresco', 'share'] }),
  });
  btn.disabled = false;
  showToast(`Alfresco: ${res.alfresco}, Share: ${res.share}`, 'info');
  setTimeout(refreshAll, 3000);
}

async function refreshAll() {
  await Promise.all([refreshStatus(), refreshAmps(), refreshJars(), refreshFiles()]);
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }

refreshAll();
setInterval(refreshStatus, 10000);
</script>
</body>
</html>
